name: DocuScan Published Site Smoke Test
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-site:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          bash scripts/install_ci_chromium.sh
      - name: Wait for published site
        run: |
          python - <<'PY'
          import time,urllib.request
          url='https://mlanza-pixel.github.io/scan2pdf/'
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(url,timeout=12) as r:
                      if r.status==200:break
              except Exception:pass
              time.sleep(10)
          else:raise SystemExit('Published site unavailable')
          PY
      - name: Published site screenshot and navigation checks
        run: python scripts/universal_capture_v771.py https://mlanza-pixel.github.io/scan2pdf/
      - name: Published site navigation stress
        if: always()
        run: python scripts/test_stress_v771.py https://mlanza-pixel.github.io/scan2pdf/
      - name: Upload published site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docuscan-v7-71-published-site-evidence
          path: |
            screenshots/
            tests/results/v771-browser-stress.json
          if-no-files-found: error
          retention-days: 30
