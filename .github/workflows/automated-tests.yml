name: DocuScan Automated Regression and Screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pypdf pillow
          python -m playwright install --with-deps chromium
      - name: Generate realistic OCR PDF fixtures (synthetic ground truth)
        run: |
          python -m pip install reportlab
          python scripts/generate_ocr_fixtures_v773.py --pages 5 10 25 50 --out tests/fixtures/generated
          python scripts/verify_ocr_fixtures_v773.py tests/fixtures/generated
      - name: Generate and verify upstream ocrtestdata image-backed PDFs
        run: |
          python -m pip install Faker qrcode[pil] PyMuPDF
          python scripts/generate_upstream_ocr_fixtures_v774.py --pages 5 10 25 --dpi 100 --out tests/fixtures/upstream-generated
      - name: Upload upstream OCR test fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v774-upstream-ocrtestdata-fixtures
          path: tests/fixtures/upstream-generated/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload OCR fixtures and manifests for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v774-realistic-ocr-fixtures
          path: tests/fixtures/generated/
          if-no-files-found: warn
          retention-days: 14
      - name: Core regression tests
        run: npm test
      - name: Start local web server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/docuscan-server.log 2>&1 &
          echo $! > /tmp/docuscan-server.pid
          python - <<'PYCODE'
          import time,urllib.request
          for i in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/',timeout=2)
                  break
              except Exception:
                  time.sleep(.5)
          else: raise RuntimeError('Server did not start')
          PYCODE
      - name: Capture all workspaces and Tools categories
        if: always()
        run: python scripts/universal_capture_v771.py http://127.0.0.1:8765/
      - name: Browser navigation stress test
        if: always()
        run: python scripts/test_stress_v771.py http://127.0.0.1:8765/
      - name: Real browser imports (3 images, 5 and 10 page PDFs)
        if: always()
        run: python scripts/test_real_imports_v771.py http://127.0.0.1:8765/
      - name: Extended document and image stress (10/25/50 images, 20/50/100 PDF pages, export, corrupt PDF)
        if: always()
        timeout-minutes: 22
        run: python scripts/test_extended_workflows_v771.py http://127.0.0.1:8765/
      - name: Save screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docuscan-v7-74-test-evidence
          path: |
            screenshots/
            tests/results/
            /tmp/docuscan-server.log
          if-no-files-found: warn
          retention-days: 30
