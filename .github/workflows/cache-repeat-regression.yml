name: DocuScan Repeated Cache and Reload Regression
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cache-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: desktop, cycles: 10}
          - {profile: desktop, cycles: 20}
          - {profile: desktop, cycles: 100}
          - {profile: iphone, cycles: 10}
          - {profile: ipad, cycles: 10}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local app
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/docuscan-cache-server.log 2>&1 &
          python - <<'PY'
          import time,urllib.request
          for i in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/',timeout=2)
                  break
              except Exception:time.sleep(.5)
          else:raise RuntimeError('Server did not start')
          PY
      - name: Repeat real reloads
        run: python scripts/test_cache_reload_cycles.py http://127.0.0.1:8765/ --profile '${{ matrix.profile }}' --cycles '${{ matrix.cycles }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-reload-${{ matrix.profile }}-${{ matrix.cycles }}
          path: tests/results/cache-reload/
          if-no-files-found: warn
          retention-days: 30
