name: DocuScan Complete Workflow Shards
on:
  workflow_dispatch:
    inputs:
      stress:
        description: Run 1000 fixture workflow-suite executions (250 per profile)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  workflow-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, iphone-emulated, ipad-emulated, android-emulated]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        timeout-minutes: 8
      - name: Install browser
        run: npx playwright install chromium
        timeout-minutes: 6
      - name: Validate release and core tests
        run: npm test
      - name: Run fixture workflow suites
        env:
          DOCUSCAN_TEST_PROFILE: ${{ matrix.profile }}
          DOCUSCAN_TEST_REPEATS: ${{ inputs.stress && '250' || '1' }}
        run: npm run test:workflows
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-v775-${{ matrix.profile }}
          path: tests/results/v7.75.0/
          if-no-files-found: warn
          retention-days: 30
